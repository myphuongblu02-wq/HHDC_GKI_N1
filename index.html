var VS=A.vs&&A.vs.length?A.vs:[{c:"",i:A.i,o:A.o}],QD={};Q.forEach(function(x){QD[x.id]=x});var want=($("hm").value||"").trim(),V=VS.filter(function(v){return String(v.c)==want})[0]||VS[Math.floor(Math.random()*VS.length)];
var it=V.i.map(function(id,k){var x=QD[id];return x?{x:x,op:x.t=="m"?V.o[k].split("").map(function(j){return[x.o[+j],+j==0]}):null}:null}).filter(Boolean);
if(A.z2)it.forEach(function(t){if(t.op)t.op=sh(t.op)});
if(A.z1){var r=[];["m","tf","s"].forEach(function(t){r=r.concat(sh(it.filter(function(q){return q.x.t==t})))});it=r}
CUR={it:it,vc:V.c,nm:nm,cl:cl,t0:Date.now(),end:Date.now()+A.m*60000,w:0,done:0};render()}
function render(){var H={m:"PHẦN I. Trắc nghiệm nhiều phương án lựa chọn",tf:"PHẦN II. Trắc nghiệm đúng sai",s:"PHẦN III. Trắc nghiệm trả lời ngắn"},no={m:0,tf:0,s:0},last="",h="";
CUR.it.forEach(function(t,k){var x=t.x;if(x.t!=last){h+='<div class="ph">'+H[x.t]+'</div>';last=x.t}no[x.t]++;h+='<div class="qc"><b>Câu '+no[x.t]+'.</b> '+x.q;
if(x.t=="m")t.op.forEach(function(o,j){h+='<label class="opt"><input type="radio" name="q'+k+'" value="'+j+'"><span><b>'+"ABCD"[j]+'.</b> '+o[0]+'</span></label>'});
else if(x.t=="tf")x.s2.forEach(function(o,j){h+='<div class="tfr"><span>'+"abcd"[j]+') '+o[0]+'</span><select id="q'+k+'_'+j+'"><option value="">–</option><option value="1">Đúng</option><option value="0">Sai</option></select></div>'});
else h+='<div><input id="q'+k+'" placeholder="Đáp số" size="14" style="margin-top:8px"></div>';
h+='<div class="w" id="w'+k+'"></div></div>'});
$("app").innerHTML='<div class="top" style="position:sticky;top:0;z-index:4"><div><h2>'+esc(A.t)+'</h2><p>'+esc(CUR.nm)+(CUR.cl?' · lớp '+esc(CUR.cl):'')+(CUR.vc?' · Mã đề '+esc(CUR.vc):'')+'</p></div><div class="sp"></div><span class="tm" id="tm">--:--</span><button class="s" onclick="sbm()">Nộp bài</button></div><div id="wn" class="no" style="font-weight:600"></div><div id="rc"></div>'+h;
clearInterval(TI);TI=setInterval(tick,500);tick()}
function tick(){if(!CUR||CUR.done)return;var s=Math.max(0,Math.round((CUR.end-Date.now())/1000));$("tm").textContent=("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2);if(!s)sbm()}
document.addEventListener("visibilitychange",function(){if(document.hidden&&CUR&&!CUR.done){CUR.w++;var b=$("wn");if(b)b.textContent="Cảnh báo: bạn đã rời khỏi trang làm bài "+CUR.w+" lần.";if(A.ac&&CUR.w>=A.ac)sbm()}});
function ansOf(t,k){var x=t.x;if(x.t=="m"){var r=document.querySelector("input[name=q"+k+"]:checked");return r?String(x.o.indexOf(t.op[r.value][0])):"-"}if(x.t=="tf")return x.s2.map(function(o,j){var v=$("q"+k+"_"+j).value;return v===""?"-":v}).join("");return $("q"+k).value.trim()}
function gr(x,a){if(x.t=="m")return a==="0"?1:0;if(x.t=="tf"){var s=0;x.s2.forEach(function(o,j){if(a[j]==String(o[1]))s+=.25});return s}var v=parseFloat(String(a).replace("−","-").replace(",","."));return Math.abs(v-x.a)<=x.tol+1e-9?1:0}
function kk(x){return x.t=="m"?x.o[0]:x.t=="tf"?x.s2.map(function(o,j){return"abcd"[j]+"-"+(o[1]?"Đ":"S")}).join(" "):String(x.a).replace(".",",")}
function sbm(){if(!CUR||CUR.done)return;CUR.done=1;clearInterval(TI);var sc=0,xs=[];
CUR.it.forEach(function(t,k){var a=ansOf(t,k);xs.push(a);var p=gr(t.x,a);sc+=p;if(A.k!==0)$("w"+k).innerHTML='<span class="'+(p==1?"ok":"no")+'">'+(p==1?"Đúng":p>0?"Đúng một phần":"Chưa đúng")+'</span> · Đáp án: '+kk(t.x)+'. '+t.x.w});
document.querySelectorAll("input,select").forEach(function(e){e.disabled=true});
var n=CUR.it.length,d=Math.round(sc/n*1000)/100,rec={g:A.g,c:A.t,m:CUR.vc||"",n:CUR.nm,l:CUR.cl,s:d,r:fx(sc,2)+"/"+n,e:Math.round((Date.now()-CUR.t0)/1000),w:CUR.w,t:new Date().toISOString(),i:CUR.it.map(function(t){return t.x.id}),x:xs};
$("tm").textContent=A.p!==0?"Điểm "+fx(d,1):"Đã nộp";
$("rc").innerHTML='<div class="card"><b>Đã nộp bài.'+(A.p!==0?' Điểm: '+fx(d,1)+'/10 ('+rec.r+' câu đúng).':' Giáo viên sẽ thông báo điểm.')+'</b>'+(CUR.w?'<div class="no">Số lần rời trang: '+CUR.w+'</div>':'')+'<p class="hint">Gửi mã kết quả dưới đây cho giáo viên (Zalo, email) để bài của bạn được ghi nhận.</p><textarea id="rcode" readonly rows="3">'+enc(rec)+'</textarea><p><button onclick="cp()">Sao chép mã kết quả</button></p></div>';window.scrollTo(0,0)}
function cp(){var t=$("rcode");t.select();try{document.execCommand("copy")}catch(e){}}
home();
</script></body></html>
